name: CloudGuardian Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Start Services
      run: |
        # Start Backend, Postgres, Redis
        docker-compose up -d backend postgres redis
        
        # Wait for services to be healthy
        echo "Waiting for services..."
        sleep 30
        docker-compose ps
        
        # Check backend logs if needed
        # docker-compose logs backend

    - name: Wait for API Health
      run: |
        timeout 60 bash -c 'until curl -s http://localhost:8000/health; do sleep 5; done'
        echo "API is up!"

    - name: Install CloudGuardian CLI
      run: |
        python -m pip install --upgrade pip
        pip install ./apps/cli

    - name: Run CloudGuardian Scan
      env:
        # Connect to localhost since we are on the host network or port mapped
        CLOUDGUARDIAN_API_URL: http://localhost:8000
        # Token not strictly needed for basic scan if auth disabled or using default admin
        # Using a dummy token for now as per dev config
        CLOUDGUARDIAN_API_TOKEN: "dev-token" 
      run: |
        # Generate both valid SARIF and human readable HTML
        cloudguardian scan . --format sarif --output results.sarif || true
        cloudguardian scan . --format html --output report.html || true
        
        # Fail build if critical issues found (CLI exits 1)
        # We run this last to ensure artifacts are generated first
        # cloudguardian scan . 

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: Upload HTML Report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: report.html
