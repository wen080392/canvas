<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Graph - CloudGuardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React Flow -->
    <link href="https://cdn.jsdelivr.net/npm/reactflow@11.7.4/dist/style.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/reactflow@11.7.4/dist/reactflow.min.js"></script>

    <!-- Dagre -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
</head>

<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col z-50">
            <div class="p-6">
                <h1 class="text-2xl font-bold flex items-center">
                    <i class="fas fa-shield-alt mr-2 text-blue-400"></i>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm z-10">
                <div class="px-8 py-4 flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Infrastructure Graph</h2>
                        <p class="text-gray-600 text-sm">Visual representation of your cloud resources and dependencies
                        </p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-bell text-xl"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            <i class="fas fa-download mr-2"></i>
                            Export
                        </button>
                    </div>
                </div>
            </header>

            <!-- Graph Container -->
            <main class="flex-1 p-6 overflow-hidden">
                <div class="h-full bg-white rounded-xl shadow-lg border border-gray-200 relative overflow-hidden">
                    <!-- React Flow Canvas -->
                    <div id="root" class="w-full h-full"></div>

                    <!-- Floating Controls -->
                    <div class="absolute top-4 right-4 z-10">
                        <button id="loadSampleBtn"
                            class="px-6 py-3 bg-blue-600 text-white rounded-lg shadow-lg hover:bg-blue-700 transition flex items-center">
                            <i class="fas fa-play mr-2"></i>
                            Load Sample Infrastructure
                        </button>
                    </div>

                    <!-- Legend -->
                    <div class="absolute bottom-4 left-4 bg-white rounded-lg shadow-lg p-4 border border-gray-200 z-10">
                        <h3 class="text-sm font-semibold text-gray-700 mb-2">Resource Types</h3>
                        <div class="space-y-2 text-sm">
                            <div class="flex items-center">
                                <div class="w-3 h-3 bg-blue-500 rounded mr-2"></div>
                                <span class="text-gray-600">Storage (S3, Volumes)</span>
                            </div>
                            <div class="flex items-center">
                                <div class="w-3 h-3 bg-orange-500 rounded mr-2"></div>
                                <span class="text-gray-600">Compute (EC2, Lambda)</span>
                            </div>
                            <div class="flex items-center">
                                <div class="w-3 h-3 bg-purple-500 rounded mr-2"></div>
                                <span class="text-gray-600">Network (VPC, Security Groups)</span>
                            </div>
                            <div class="flex items-center">
                                <div class="w-3 h-3 bg-blue-600 rounded mr-2"></div>
                                <span class="text-gray-600">Database (RDS, DynamoDB)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useCallback, useEffect } = React;
        const { ReactFlow, Controls, Background, useNodesState, useEdgesState } = window.ReactFlow;

        // Custom Node Component
        const ResourceNode = ({ data }) => {
            return (
                <div
                    className="px-4 py-3 shadow-xl rounded-lg border-2 min-w-[180px]"
                    style={{
                        backgroundColor: data.color + '20',
                        borderColor: data.color
                    }}
                >
                    <div className="flex items-center space-x-2">
                        <span className="text-2xl">{data.icon}</span>
                        <div>
                            <div className="font-bold text-sm text-gray-800">{data.label}</div>
                            <div className="text-xs text-gray-600 capitalize">{data.category}</div>
                        </div>
                    </div>
                </div>
            );
        };

        const nodeTypes = {
            custom: ResourceNode
        };

        // Dagre layout algorithm
        const getLayoutedElements = (nodes, edges, direction = 'TB') => {
            const dagreGraph = new dagre.graphlib.Graph();
            dagreGraph.setDefaultEdgeLabel(() => ({}));

            const nodeWidth = 200;
            const nodeHeight = 80;

            const isHorizontal = direction === 'LR';
            dagreGraph.setGraph({
                rankdir: direction,
                nodesep: 100,
                ranksep: 150
            });

            nodes.forEach((node) => {
                dagreGraph.setNode(node.id, { width: nodeWidth, height: nodeHeight });
            });

            edges.forEach((edge) => {
                dagreGraph.setEdge(edge.source, edge.target);
            });

            dagre.layout(dagreGraph);

            nodes.forEach((node) => {
                const nodeWithPosition = dagreGraph.node(node.id);
                node.targetPosition = isHorizontal ? 'left' : 'top';
                node.sourcePosition = isHorizontal ? 'right' : 'bottom';

                node.position = {
                    x: nodeWithPosition.x - nodeWidth / 2,
                    y: nodeWithPosition.y - nodeHeight / 2,
                };

                return node;
            });

            return { nodes, edges };
        };

        // Main App Component
        function InfrastructureMap() {
            const [nodes, setNodes, onNodesChange] = useNodesState([]);
            const [edges, setEdges, onEdgesChange] = useEdgesState([]);
            const [selectedNode, setSelectedNode] = useState(null);
            const [loading, setLoading] = useState(false);

            const onNodeClick = useCallback((event, node) => {
                setSelectedNode(node);
                console.log('Node clicked:', node);
            }, []);

            const loadSampleData = async () => {
                setLoading(true);

                const sampleTerraform = `
resource "aws_vpc" "main" {
  cidr_block = "10.0.0.0/16"
  tags = {
    Name = "Main VPC"
  }
}

resource "aws_subnet" "public" {
  vpc_id     = aws_vpc.main.id
  cidr_block = "10.0.1.0/24"
  tags = {
    Name = "Public Subnet"
  }
}

resource "aws_security_group" "web" {
  name        = "web-sg"
  vpc_id      = aws_vpc.main.id
  description = "Web security group"
}

resource "aws_instance" "web_server" {
  ami                    = "ami-12345678"
  instance_type          = "t2.micro"
  subnet_id              = aws_subnet.public.id
  vpc_security_group_ids = [aws_security_group.web.id]
  tags = {
    Name = "Web Server"
  }
}

resource "aws_s3_bucket" "data" {
  bucket = "my-data-bucket"
  tags = {
    Name = "Data Bucket"
  }
}

resource "aws_db_instance" "main" {
  allocated_storage    = 20
  engine               = "postgres"
  instance_class       = "db.t3.micro"
  vpc_security_group_ids = [aws_security_group.web.id]
  db_subnet_group_name = "main"
  tags = {
    Name = "Main Database"
  }
}
`;

                try {
                    const token = localStorage.getItem('access_token');
                    if (!token) {
                        window.location.href = 'login.html';
                        return;
                    }

                    const response = await fetch('http://localhost:8000/graph/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ content: sampleTerraform })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'Failed to generate graph');
                    }

                    const data = await response.json();

                    // Apply layout
                    const layouted = getLayoutedElements(data.nodes, data.edges);

                    setNodes(layouted.nodes);
                    setEdges(layouted.edges);

                    // Fit view after a short delay to allow rendering
                    setTimeout(() => window.reactFlowInstance && window.reactFlowInstance.fitView(), 100);

                } catch (error) {
                    console.error('Error loading graph:', error);
                    alert('Failed to load graph: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                document.getElementById('loadSampleBtn').onclick = loadSampleData;
            }, []);

            return (
                <ReactFlow
                    nodes={nodes}
                    edges={edges}
                    onNodesChange={onNodesChange}
                    onEdgesChange={onEdgesChange}
                    onNodeClick={onNodeClick}
                    nodeTypes={nodeTypes}
                    fitView
                    className="bg-gray-50"
                >
                    <Controls className="bg-white border border-gray-300 rounded-lg shadow-lg" />
                    <Background color="#e5e7eb" gap={16} />
                </ReactFlow>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InfrastructureMap />);
    </script>
</body>

</html>
