<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Scanner - CloudGuardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }
    </script>
</head>

<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold flex items-center">
                    <i class="fas fa-shield-alt mr-2 text-blue-400"></i>
                    CloudGuardian
                </h1>
                <p class="text-gray-400 text-sm mt-1">Security Platform</p>
            </div>

            <nav class="flex-1 px-4 space-y-1">
                <a href="index.html" class="flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg transition">
                    <i class="fas fa-chart-line mr-3"></i>
                    Dashboard
                </a>
                <a href="graph.html" class="flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg transition">
                    <i class="fas fa-project-diagram mr-3"></i>
                    Infrastructure Graph
                </a>
                <a href="#" class="flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg transition">
                    <i class="fas fa-robot mr-3"></i>
                    Auto-Remediation
                </a>
                <a href="compliance_report.html"
                    class="flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg transition">
                    <i class="fas fa-certificate mr-3"></i>
                    Compliance
                </a>
                <a href="secret_scanner.html"
                    class="flex items-center px-4 py-3 bg-blue-600 rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-key mr-3"></i>
                    Secret Scanner
                </a>
                <a href="settings.html" class="flex items-center px-4 py-3 hover:bg-gray-800 rounded-lg transition">
                    <i class="fas fa-cog mr-3"></i>
                    Settings
                </a>
            </nav>

            <div class="p-4 border-t border-gray-800">
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium">Admin User</p>
                        <p class="text-xs text-gray-400">admin@company.com</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm z-10">
                <div class="px-8 py-4 flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Secret Scanner</h2>
                        <p class="text-gray-600 text-sm">Detect hardcoded credentials and secrets in your code</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
                            <i class="fas fa-bell text-xl"></i>
                            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <main class="flex-1 overflow-y-auto p-8">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-full">

                    <!-- Input Section -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">Scan Content</h3>
                        <div class="flex-1 flex flex-col">
                            <textarea id="scanInput"
                                class="flex-1 w-full p-4 bg-gray-50 border border-gray-200 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                                placeholder="Paste your code here to scan for secrets..."></textarea>
                            <div class="mt-4 flex justify-between items-center">
                                <button id="loadSampleBtn"
                                    class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                                    Load Sample with Secrets
                                </button>
                                <button id="scanBtn"
                                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center">
                                    <i class="fas fa-search mr-2"></i>
                                    Scan Now
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Results Section -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold text-gray-800">Scan Results</h3>
                            <span id="statusBadge"
                                class="hidden px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
                                Ready
                            </span>
                        </div>

                        <div id="resultsContainer" class="flex-1 overflow-y-auto">
                            <!-- Empty State -->
                            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400">
                                <i class="fas fa-shield-virus text-4xl mb-4"></i>
                                <p>No scan results yet</p>
                            </div>

                            <!-- Results List -->
                            <div id="findingsList" class="space-y-4 hidden">
                                <!-- Findings injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const scanInput = document.getElementById('scanInput');
        const scanBtn = document.getElementById('scanBtn');
        const loadSampleBtn = document.getElementById('loadSampleBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const findingsList = document.getElementById('findingsList');
        const emptyState = document.getElementById('emptyState');
        const statusBadge = document.getElementById('statusBadge');

        // Sample code with secrets
        const sampleCode = `
provider "aws" {
  region = "us-west-2"
  access_key = "AKIAIOSFODNN7EXAMPLE"
  secret_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
}

resource "github_repository" "example" {
  name = "example"
  # Do not commit this!
  token = "ghp_1234567890abcdef1234567890abcdef36"
}

# High entropy string test
api_key = "ab8392847592837492837492837492837492"
`;

        loadSampleBtn.addEventListener('click', () => {
            scanInput.value = sampleCode.trim();
        });

        scanBtn.addEventListener('click', async () => {
            const content = scanInput.value;
            if (!content) return;

            // UI Loading State
            scanBtn.disabled = true;
            scanBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Scanning...';

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('http://localhost:8000/secrets/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        content: content,
                        filename: "manual_input.txt"
                    })
                });

                if (!response.ok) throw new Error('Scan failed');

                const data = await response.json();
                renderResults(data);

            } catch (error) {
                console.error('Scan error:', error);
                alert('Scan failed: ' + error.message);
            } finally {
                scanBtn.disabled = false;
                scanBtn.innerHTML = '<i class="fas fa-search mr-2"></i>Scan Now';
            }
        });

        function renderResults(data) {
            emptyState.classList.add('hidden');
            findingsList.classList.remove('hidden');
            findingsList.innerHTML = '';

            // Update Status Badge
            statusBadge.classList.remove('hidden');
            if (data.total_findings > 0) {
                statusBadge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700';
                statusBadge.textContent = `${data.total_findings} Issues Found`;
            } else {
                statusBadge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700';
                statusBadge.textContent = 'No Issues Found';
            }

            if (data.total_findings === 0) {
                findingsList.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-check text-2xl text-green-600"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-900">Clean Code!</h3>
                        <p class="text-gray-500 mt-2">No secrets detected in the scanned content.</p>
                    </div>
                `;
                return;
            }

            // Render Findings
            data.findings.forEach(finding => {
                const severityColors = {
                    'CRITICAL': 'bg-red-100 text-red-800 border-red-200',
                    'HIGH': 'bg-orange-100 text-orange-800 border-orange-200',
                    'MEDIUM': 'bg-yellow-100 text-yellow-800 border-yellow-200',
                    'LOW': 'bg-blue-100 text-blue-800 border-blue-200'
                };

                const card = document.createElement('div');
                card.className = 'border border-gray-200 rounded-lg p-4 hover:shadow-md transition bg-white';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center">
                            <span class="px-2 py-1 rounded text-xs font-bold border ${severityColors[finding.severity] || 'bg-gray-100'}">
                                ${finding.severity}
                            </span>
                            <span class="ml-2 text-sm font-medium text-gray-900">${finding.type}</span>
                        </div>
                        <span class="text-xs text-gray-500">Line ${finding.line}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${finding.description}</p>
                    <div class="bg-gray-50 rounded p-2 font-mono text-xs text-gray-700 border border-gray-200 overflow-x-auto">
                        ${escapeHtml(finding.snippet)}
                    </div>
                `;
                findingsList.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
