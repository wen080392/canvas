<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Scanner - CloudGuardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        black: '#000000',
                        gray: { 850: '#121212', 900: '#0a0a0a', 950: '#050505' },
                        cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
                        blue: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    fontFamily: { sans: ['Outfit', 'Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000000;
            color: #e5e5e5;
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-sidebar {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glow-button {
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
            border-color: rgba(34, 211, 238, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }
    </script>
</head>

<body class="h-screen overflow-hidden antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <!-- Background Ambience -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[20%] right-[10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[10%] left-[20%] w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[120px]">
        </div>
    </div>

    <div class="flex h-screen relative z-10">
        <!-- Sidebar -->
        <aside class="w-72 glass-sidebar flex flex-col z-20">
            <div class="p-8 pb-6">
                <h1 class="text-2xl font-bold flex items-center tracking-tight group cursor-pointer"
                    onclick="location.href='index.html'">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-blue-600/20 border border-white/10 flex items-center justify-center mr-3 group-hover:border-cyan-500/50 transition-colors">
                        <i class="fas fa-shield-alt text-cyan-400 text-lg"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white font-bold tracking-wide">CloudGuardian</span>
                        <span class="text-[10px] text-gray-500 font-mono uppercase tracking-widest">Enterprise</span>
                    </div>
                </h1>
            </div>

            <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
                <div class="px-4 py-2 text-xs font-mono text-gray-600 uppercase tracking-widest font-semibold">Platform
                </div>

                <a href="index.html"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 border-l-2 border-transparent hover:border-white/20 rounded-r-lg transition-all group">
                    <i class="fas fa-chart-line w-6 group-hover:text-cyan-400 transition-colors"></i>
                    <span class="font-medium">Dashboard</span>
                </a>

                <a href="graph.html"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 border-l-2 border-transparent hover:border-white/20 rounded-r-lg transition-all group">
                    <i class="fas fa-project-diagram w-6 group-hover:text-purple-400 transition-colors"></i>
                    <span class="font-medium">Infrastructure</span>
                </a>

                <a href="secret_scanner.html"
                    class="flex items-center px-4 py-3 bg-white/5 border-l-2 border-blue-500 text-white rounded-r-lg transition-all">
                    <i class="fas fa-key w-6 text-blue-400"></i>
                    <span class="font-medium">Secret Scanner</span>
                </a>

                <a href="compliance_report.html"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 border-l-2 border-transparent hover:border-white/20 rounded-r-lg transition-all group">
                    <i class="fas fa-clipboard-check w-6 group-hover:text-emerald-400 transition-colors"></i>
                    <span class="font-medium">Compliance</span>
                </a>

                <div class="px-4 py-2 mt-6 text-xs font-mono text-gray-600 uppercase tracking-widest font-semibold">
                    Settings</div>
                <a href="settings.html"
                    class="flex items-center px-4 py-3 text-gray-400 hover:text-white hover:bg-white/5 border-l-2 border-transparent hover:border-white/20 rounded-r-lg transition-all group">
                    <i class="fas fa-cog w-6 group-hover:text-gray-300 transition-colors"></i>
                    <span class="font-medium">Configuration</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden relative">
            <header class="glass-panel z-20 h-20 flex items-center justify-between px-8 border-b-0">
                <div>
                    <h2 class="text-2xl font-bold text-white tracking-tight">Secret Scanner</h2>
                    <p class="text-gray-400 text-xs font-mono mt-1 uppercase tracking-wide">Real-time Credential Leak
                        Detection</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button
                        class="w-10 h-10 rounded-full bg-white/5 border border-white/10 text-gray-400 hover:text-white hover:border-cyan-500/30 transition flex items-center justify-center relative">
                        <i class="fas fa-bell"></i>
                        <span
                            class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-8 relative bg-black">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-full max-w-7xl mx-auto">

                    <!-- Left Column: Inputs -->
                    <div class="flex flex-col gap-6">

                        <!-- Manual Scan Card -->
                        <div class="glass-panel rounded-2xl p-1 flex flex-col h-2/3">
                            <div
                                class="bg-gray-900/50 rounded-t-xl p-4 border-b border-white/5 flex justify-between items-center">
                                <h3 class="font-semibold text-white flex items-center text-sm uppercase tracking-wide">
                                    <i class="fas fa-code mr-2 text-cyan-400"></i> Code Analysis
                                </h3>
                                <button id="loadSampleBtn"
                                    class="text-xs text-cyan-400 hover:text-cyan-300 transition uppercase tracking-wider font-medium border border-cyan-500/30 px-3 py-1 rounded-lg hover:bg-cyan-500/10">
                                    Load Sample
                                </button>
                            </div>
                            <div class="flex-1 p-1 relative group bg-black/40">
                                <textarea id="scanInput"
                                    class="w-full h-full bg-transparent p-6 text-sm font-mono text-cyan-50 resize-none focus:outline-none placeholder-gray-700"
                                    placeholder="// Paste your infrastructure code here to scan for secrets..."></textarea>
                            </div>
                            <div class="p-4 border-t border-white/5 bg-gray-900/50 rounded-b-xl">
                                <button id="scanBtn"
                                    class="w-full py-3 bg-cyan-600/20 border border-cyan-500/50 text-cyan-300 font-semibold rounded-xl hover:bg-cyan-600 hover:text-white hover:border-cyan-400 transition-all duration-300 shadow-lg shadow-cyan-900/20 active:scale-[0.98]">
                                    <i class="fas fa-search mr-2"></i> Run Deep Scan
                                </button>
                            </div>
                        </div>

                        <!-- GitHub Scan Card -->
                        <div class="glass-panel rounded-2xl p-6 flex-1">
                            <h3 class="font-semibold text-white flex items-center mb-5 text-sm uppercase tracking-wide">
                                <i class="fab fa-github mr-2 text-white"></i> GitHub Repository Scan
                            </h3>
                            <div class="flex flex-col gap-4">
                                <div class="relative">
                                    <label
                                        class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Target
                                        Repository</label>
                                    <div class="flex gap-2">
                                        <div class="relative flex-1">
                                            <i
                                                class="fas fa-code-branch absolute left-4 top-3.5 text-gray-500 pointer-events-none"></i>
                                            <select id="repoSelect"
                                                class="w-full bg-black/50 border border-white/10 text-gray-300 text-sm rounded-xl focus:ring-1 focus:ring-cyan-500 focus:border-cyan-500 block pl-10 p-3 appearance-none cursor-pointer hover:border-white/20 transition">
                                                <option value="">Select a repository...</option>
                                            </select>
                                            <i
                                                class="fas fa-chevron-down absolute right-4 top-4 text-xs text-gray-500 pointer-events-none"></i>
                                        </div>
                                        <button id="refreshReposBtn"
                                            class="p-3 w-12 bg-white/5 border border-white/10 text-gray-400 rounded-xl hover:text-white hover:bg-white/10 transition">
                                            <i class="fas fa-sync-alt"></i>
                                        </button>
                                    </div>
                                </div>
                                <button id="scanGithubBtn" disabled
                                    class="w-full py-3 bg-white/5 border border-white/10 text-gray-500 font-medium rounded-xl transition-all duration-200 hover:bg-white/10 hover:text-white hover:border-white/20 disabled:opacity-30 disabled:cursor-not-allowed mt-auto">
                                    <i class="fab fa-github mr-2"></i> Scan Repository Actions
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Results -->
                    <div class="glass-panel rounded-2xl flex flex-col h-full overflow-hidden">
                        <div class="bg-gray-900/50 p-5 border-b border-white/5 flex justify-between items-center">
                            <h3 class="font-semibold text-white text-sm uppercase tracking-wide">Security Findings</h3>
                            <span id="statusBadge"
                                class="hidden px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm">Ready</span>
                        </div>

                        <div id="resultsContainer" class="flex-1 overflow-y-auto p-4 bg-black/20 custom-scrollbar">
                            <!-- Empty State -->
                            <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-600">
                                <div
                                    class="w-24 h-24 rounded-full bg-white/5 flex items-center justify-center mb-6 border border-white/5 animate-pulse">
                                    <i class="fas fa-shield-virus text-4xl text-gray-700"></i>
                                </div>
                                <p class="text-lg font-medium text-gray-500">Awaiting Analysis</p>
                                <p class="text-sm text-gray-600 mt-2 font-mono">Select a target to begin scanning</p>
                            </div>

                            <!-- Results List -->
                            <div id="findingsList" class="space-y-4 hidden"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts (Functionality Preserved) -->
    <script src="js/config.js"></script>
    <script>
        const API_BASE = window.API_BASE;
        const scanInput = document.getElementById('scanInput');
        const scanBtn = document.getElementById('scanBtn');
        const loadSampleBtn = document.getElementById('loadSampleBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const findingsList = document.getElementById('findingsList');
        const emptyState = document.getElementById('emptyState');
        const statusBadge = document.getElementById('statusBadge');
        const repoSelect = document.getElementById('repoSelect');
        const refreshReposBtn = document.getElementById('refreshReposBtn');
        const scanGithubBtn = document.getElementById('scanGithubBtn');
        let repositories = [];

        const sampleCode = `provider "aws" {
  region = "us-west-2"
  access_key = "AKIAIOSFODNN7EXAMPLE"
  secret_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
}

resource "github_repository" "example" {
  name = "example"
  # Leaked Token
  token = "ghp_1234567890abcdef1234567890abcdef36"
}`;

        loadSampleBtn.addEventListener('click', () => { scanInput.value = sampleCode.trim(); });

        async function loadRepositories() {
            try {
                refreshReposBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${API_BASE}/github/repos`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.ok) {
                    const data = await response.json();
                    repositories = data.repositories;
                    renderRepoOptions();
                }
            } catch (e) {
                console.error(e); // Silent error in prod
                // Mock for demo
                repositories = [{ html_url: "https://github.com/demo/repo", full_name: "demo/repo" }];
                renderRepoOptions();
            } finally {
                refreshReposBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
            }
        }

        function renderRepoOptions() {
            repoSelect.innerHTML = '<option value="">Select a repository...</option>';
            repositories.forEach(repo => {
                const option = document.createElement('option');
                option.value = repo.html_url;
                option.textContent = repo.full_name;
                repoSelect.appendChild(option);
            });
        }

        repoSelect.addEventListener('change', () => {
            if (repoSelect.value) {
                scanGithubBtn.removeAttribute('disabled');
                scanGithubBtn.classList.remove('bg-white/5', 'text-gray-500');
                scanGithubBtn.classList.add('bg-white', 'text-black', 'hover:bg-gray-200');
            } else {
                scanGithubBtn.setAttribute('disabled', 'true');
                scanGithubBtn.classList.add('bg-white/5', 'text-gray-500');
                scanGithubBtn.classList.remove('bg-white', 'text-black', 'hover:bg-gray-200');
            }
        });

        refreshReposBtn.addEventListener('click', loadRepositories);
        setTimeout(loadRepositories, 500);

        async function performScan(url, body) {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href = 'login.html'; return; }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(body)
                });
                if (response.status === 401) { window.location.href = 'login.html'; return; }
                const data = await response.json();
                renderResults({ secrets: data.secrets || data.findings || [] });
            } catch (error) {
                // Mock result for demo if backend offline
                alert('Scan Simulation (Backend might be offline): ' + error.message);
                renderResults({
                    secrets: [
                        { severity: 'CRITICAL', type: 'AWS_ACCESS_KEY', line_number: 3, description: 'AWS Access Key detected', matched_string: 'AKIAIOSFODNN7EXAMPLE' },
                        { severity: 'HIGH', type: 'GITHUB_TOKEN', line_number: 9, description: 'GitHub Personal Access Token detected', matched_string: 'ghp_1234567890abcdef' }
                    ]
                });
            }
        }

        scanBtn.addEventListener('click', async () => {
            const content = scanInput.value;
            if (!content) return;
            scanBtn.disabled = true;
            scanBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analyzing...';
            await performScan(`${API_BASE}/secrets/scan`, { content: content, filename: "manual_input.txt" });
            scanBtn.disabled = false;
            scanBtn.innerHTML = '<i class="fas fa-search mr-2"></i> Run Deep Scan';
        });

        scanGithubBtn.addEventListener('click', async () => {
            const repoUrl = repoSelect.value;
            if (!repoUrl) return;
            scanGithubBtn.disabled = true;
            scanGithubBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Scanning Repo...';
            findingsList.innerHTML = '';
            emptyState.classList.remove('hidden');
            await performScan(`${API_BASE}/github/scan`, { repo_url: repoUrl });
            scanGithubBtn.disabled = false;
            scanGithubBtn.innerHTML = '<i class="fab fa-github mr-2"></i> Scan Repository Actions';
        });

        function renderResults(data) {
            emptyState.classList.add('hidden');
            findingsList.classList.remove('hidden');
            findingsList.innerHTML = '';
            const total = (data.secrets || []).length;
            statusBadge.classList.remove('hidden');

            if (total > 0) {
                statusBadge.className = 'px-3 py-1 rounded-full text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/20 uppercase tracking-wider';
                statusBadge.textContent = `🚨 ${total} Detected`;
            } else {
                statusBadge.className = 'px-3 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-wider';
                statusBadge.textContent = '✅ Clean';
            }

            if (total === 0) {
                findingsList.innerHTML = `<div class="text-center py-12"><div class="w-16 h-16 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20"><i class="fas fa-check text-2xl text-emerald-400"></i></div><h3 class="text-lg font-bold text-white">System Secure</h3><p class="text-gray-500 mt-2 text-sm">No credential leaks detected.</p></div>`;
                return;
            }

            (data.secrets || []).forEach((finding, index) => {
                const severityConfig = {
                    'CRITICAL': { color: 'text-red-400', bg: 'bg-red-500/10', border: 'border-red-500/20', icon: 'fa-radiation' },
                    'HIGH': { color: 'text-orange-400', bg: 'bg-orange-500/10', border: 'border-orange-500/20', icon: 'fa-exclamation-triangle' },
                    'MEDIUM': { color: 'text-yellow-400', bg: 'bg-yellow-500/10', border: 'border-yellow-500/20', icon: 'fa-bolt' },
                    'LOW': { color: 'text-blue-400', bg: 'bg-blue-500/10', border: 'border-blue-500/20', icon: 'fa-info-circle' }
                };
                const style = severityConfig[finding.severity] || severityConfig['LOW'];

                const card = document.createElement('div');
                card.className = `bg-white/5 border border-white/5 rounded-xl p-4 hover:border-white/20 transition group`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex items-center">
                            <span class="px-2 py-1 rounded text-[10px] font-bold border ${style.bg} ${style.color} ${style.border} flex items-center shadow-lg uppercase tracking-wider">
                                <i class="fas ${style.icon} mr-1.5"></i> ${finding.severity}
                            </span>
                            <span class="ml-3 text-sm font-bold text-white">${finding.type.replace(/_/g, ' ')}</span>
                        </div>
                        <span class="text-[10px] font-mono text-gray-500 bg-black px-2 py-1 rounded border border-white/5">Ln ${finding.line_number || 1}</span>
                    </div>
                    <p class="text-xs text-gray-400 mb-3 pl-1">${finding.description || 'Secret detected'}</p>
                    <div class="bg-black/50 rounded-lg p-3 font-mono text-xs text-cyan-200 border border-white/5 overflow-x-auto relative group-hover:border-cyan-500/20 transition">
                         <code>${escapeHtml((finding.snippet || finding.matched_string || '').trim())}</code>
                    </div>
                `;
                findingsList.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
