[tool.poetry]
name = "cloudguardian-backend"
version = "0.1.0"
description = "CloudGuardian Backend"
authors = ["CloudGuardian Team"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"
pydantic = "^2.0.0"
python-hcl2 = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
